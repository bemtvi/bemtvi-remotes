# Enable the hooks once after cloning:
#   pre-commit install && pre-commit install --hook-type pre-push
repos:
  - repo: local
    hooks:
      - id: stylua
        name: stylua
        entry: stylua --check
        language: system
        types: [lua]
      - id: selene
        name: selene
        entry: selene
        language: system
        types: [lua]
